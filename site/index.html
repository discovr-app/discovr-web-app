<style>
@font-face{font-family:"Instrument Sans";src:url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("fonts/instrument-sans-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

:root{
  --surface-canvas:#061412;
  --ink-primary:#eaebe7;
  --ink-muted:#9ba3a0;
  --line-subtle:#283130;
  --space-4:16px;
  --space-5:24px;
  --space-6:32px;
  --space-7:48px;
  --font-sans:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:var(--surface-canvas);-webkit-text-size-adjust:100%}
body{
  background:var(--surface-canvas);
  color:var(--ink-primary);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
.page{
  min-height:100dvh;
  max-width:480px;
  margin:0 auto;
  padding:
    calc(var(--space-7) + env(safe-area-inset-top,0px))
    calc(var(--space-4) + env(safe-area-inset-right,0px))
    calc(var(--space-7) + env(safe-area-inset-bottom,0px))
    calc(var(--space-4) + env(safe-area-inset-left,0px));
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:var(--space-7);
}
.intro{display:flex;flex-direction:column;gap:var(--space-6)}
h1{margin:0;line-height:0;font-weight:400}
.wordmark{display:block;width:100%;height:auto;aspect-ratio:4.238/1}
.lines{display:flex;flex-direction:column;gap:var(--space-4)}
.lead{margin:0;font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.2px;color:var(--ink-primary)}
.sub{margin:0;font-size:16px;line-height:24px;font-weight:400;color:var(--ink-muted)}
.foot{display:flex;flex-direction:column;gap:var(--space-4)}
.rule{height:1px;background:var(--line-subtle)}
.soon{margin:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.01em;color:var(--ink-muted)}

@media print{
  html,body{background:#fff}
  body{color:#061412}
  .lead{color:#061412}
  .sub,.soon{color:#3a4442}
  .wordmark{filter:invert(1) brightness(0.3)}
}
</style>
</head>
<body>
<main class="page">
  <div class="intro">
    <h1><img class="wordmark" src="discovr-wordmark-bone.svg" alt="discovr" width="358" height="84" fetchpriority="high"></h1>
    <div class="lines">
      <p class="lead">Goa, from people who actually go out.</p>
      <p class="sub">Eight things worth doing, <br>not eight hundred.</p>
    </div>
  </div>
  <div class="foot">
    <div class="rule" aria-hidden="true"></div>
    <p class="soon">Coming soon.</p>
  </div>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
